# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: jv880

on: 
  push:
    branches: 
      - '**'
  workflow_dispatch:

jobs:
  build-linux:
    # JUCE 8.0.7's prebuilt Linux Projucer binary needs glibc >= 2.38 (confirmed by a failed run:
    # ubuntu-22.04's glibc 2.35 is too old, hence 24.04 here rather than the more conservative
    # 22.04 the other jobs might have used).
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Install Linux build dependencies"
      run: |
           sudo apt-get update
           sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
             libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
             libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
             libwebkit2gtk-4.1-dev libgtk-3-dev
           # The generated Makefile queries pkg-config for webkit2gtk/gtk+alsa/freetype2/
           # fontconfig/libcurl in a single `pkg-config --cflags ...` call - if ANY one of them
           # is missing, pkg-config emits NOTHING for the whole call (not just skips that one),
           # silently dropping freetype2's/etc's own -I flags too and breaking the build with an
           # unrelated-looking "ft2build.h not found". Hence webkit2gtk/gtk here even though this
           # project doesn't use WebBrowserComponent - it's load-bearing for the other flags.
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.7 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: linux
    - name: "Build jv880"
      run: bash -ex ./build/build-linux.sh
    - name: "Build .deb"
      run: bash -ex ./build/build-deb.sh
    - name: "zip Linux"
      run: |
           cd ./Builds/LinuxMakefile/build
           zip -r jv880.vst3.linux.zip jv880.vst3
           zip -r jv880.lv2.linux.zip jv880.lv2
           cp jv880 jv880.linux
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jv880-linux
        path: |
              ./Builds/LinuxMakefile/build/jv880.vst3.linux.zip
              ./Builds/LinuxMakefile/build/jv880.lv2.linux.zip
              ./Builds/LinuxMakefile/build/jv880.linux
              ./build/*.deb
  build-win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.7 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: windows
    - name: "Build jv880"
      run: sh -ex ./build/build-win.sh
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jv880-win
        path: |
              ./Builds/VisualStudio2022/x64/Release/VST3/jv880.vst3
              ./Builds/VisualStudio2022/x64/Release/Standalone Plugin/jv880.exe
  build-osx:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.7 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: osx
    - name: "Build macOS"
      run: sh -ex ./build/build-osx.sh
      shell: bash
    - name: "zip macOS"
      run: |
           cd ./Builds/MacOSX/build/Release/
           zip -r jv880.vst3.macOS.zip jv880.vst3
           zip -r jv880.component.macOS.zip jv880.component
           zip -r jv880.app.macOS.zip jv880.app
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jv880-osx
        path: |
              ./Builds/MacOSX/build/Release/jv880.vst3.macOS.zip
              ./Builds/MacOSX/build/Release/jv880.component.macOS.zip
              ./Builds/MacOSX/build/Release/jv880.app.macOS.zip
  release:
    name: "Release"
    needs: [build-linux, build-win, build-osx]
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    # This repo's default GITHUB_TOKEN permissions are read-only (Settings > Actions > General),
    # which made action-automatic-releases fail with "Resource not accessible by integration" -
    # explicitly requesting contents:write here overrides that default for just this job, rather
    # than loosening every job's token repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          pattern: jv880-*
          merge-multiple: true
      - run: ls -R build
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: latest
          title: jv880 Latest
          files: |
            build/**/*
